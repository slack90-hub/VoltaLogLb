<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04020b">
  <title>2707</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #04020b;
    }

    body {
      min-height: 100svh;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 50% 55%, rgba(60, 13, 83, .42), transparent 34%),
        radial-gradient(circle at 18% 17%, rgba(17, 42, 97, .28), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(88, 17, 54, .22), transparent 30%),
        linear-gradient(180deg, #02020a 0%, #09031a 55%, #020106 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: .3;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, .55) 100%),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: auto, 100% 4px;
      mix-blend-mode: overlay;
    }

    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 7vw;
      text-align: center;
      pointer-events: none;
    }

    .halo {
      position: absolute;
      width: min(78vw, 920px);
      aspect-ratio: 1.8;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 179, 51, .12), transparent 66%);
      filter: blur(24px);
      animation: breathe 4.5s ease-in-out infinite;
    }

    .number {
      position: relative;
      margin: 0;
      transform: translateY(-1vh);
      color: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(8rem, 27vw, 25rem);
      font-weight: 700;
      line-height: .78;
      letter-spacing: clamp(-.75rem, -1.4vw, -.12rem);
      background:
        linear-gradient(180deg, #fffad7 0%, #ffd86a 19%, #ff9e1f 48%, #ffe992 72%, #a94e00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 247, 182, .42);
      filter:
        drop-shadow(0 0 10px rgba(255, 232, 132, .95))
        drop-shadow(0 0 35px rgba(255, 145, 20, .7))
        drop-shadow(0 0 85px rgba(255, 61, 0, .36));
      animation: reveal 1.2s cubic-bezier(.2,.82,.25,1) both, shimmer 3.4s ease-in-out 1.1s infinite;
      user-select: none;
    }

    .number::after {
      content: "2707";
      position: absolute;
      inset: 0;
      z-index: -1;
      color: rgba(255, 179, 38, .12);
      -webkit-text-stroke: 10px rgba(255, 119, 0, .08);
      filter: blur(16px);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: max(1.6rem, env(safe-area-inset-bottom));
      z-index: 3;
      margin: 0;
      transform: translateX(-50%);
      color: rgba(255,255,255,.45);
      font-size: clamp(.62rem, 1.3vw, .78rem);
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: fade-in 1.2s ease 2s both;
      pointer-events: none;
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(.68) translateY(5vh); filter: blur(24px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes shimmer {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255,232,132,.9)) drop-shadow(0 0 35px rgba(255,145,20,.68)) drop-shadow(0 0 85px rgba(255,61,0,.34)); }
      50% { filter: drop-shadow(0 0 16px rgba(255,255,215,1)) drop-shadow(0 0 52px rgba(255,173,40,.86)) drop-shadow(0 0 105px rgba(255,47,0,.5)); }
    }

    @keyframes breathe {
      50% { transform: scale(1.12); opacity: .75; }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 620px) {
      .number {
        font-size: clamp(7.2rem, 29vw, 12rem);
        letter-spacing: -.08em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .number, .halo, .hint { animation: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="stage" aria-label="Celebrating 2707">
    <div class="halo" aria-hidden="true"></div>
    <h1 class="number">2707</h1>
  </main>
  <p class="hint">Tap anywhere for fireworks</p>

  <script>
    (() => {
      const canvas = document.getElementById("fireworks");
      const ctx = canvas.getContext("2d", { alpha: true });
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const colors = [
        [255, 205, 80], [255, 91, 91], [87, 220, 255],
        [187, 114, 255], [255, 126, 41], [108, 255, 170], [255, 240, 190]
      ];
      const particles = [];
      const rockets = [];
      let width = 0, height = 0, dpr = 1, lastLaunch = 0;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function pickColor() {
        return colors[(Math.random() * colors.length) | 0];
      }

      function launch(targetX = width * (.12 + Math.random() * .76), targetY = height * (.1 + Math.random() * .45)) {
        const color = pickColor();
        rockets.push({
          x: width * (.15 + Math.random() * .7),
          y: height + 16,
          tx: targetX,
          ty: targetY,
          vx: (targetX - width / 2) * .003,
          vy: -9.5 - Math.random() * 3.2,
          color,
          trail: []
        });
      }

      function explode(x, y, color) {
        const count = width < 600 ? 72 : 115;
        const offset = Math.random() * Math.PI;
        for (let i = 0; i < count; i++) {
          const angle = offset + (Math.PI * 2 * i / count) + (Math.random() - .5) * .08;
          const speed = 1.7 + Math.random() * 5.8;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: .009 + Math.random() * .012,
            size: .8 + Math.random() * 2,
            color,
            glitter: Math.random() > .48,
            trail: []
          });
        }
      }

      function drawRocket(r) {
        r.trail.push([r.x, r.y]);
        if (r.trail.length > 10) r.trail.shift();
        for (let i = 1; i < r.trail.length; i++) {
          const a = i / r.trail.length;
          ctx.beginPath();
          ctx.moveTo(...r.trail[i - 1]);
          ctx.lineTo(...r.trail[i]);
          ctx.strokeStyle = `rgba(${r.color.join(",")},${a * .65})`;
          ctx.lineWidth = a * 2.1;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${r.color.join(",")})`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function drawParticle(p) {
        p.trail.push([p.x, p.y]);
        if (p.trail.length > 5) p.trail.shift();
        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(...p.trail[0]);
          for (let i = 1; i < p.trail.length; i++) ctx.lineTo(...p.trail[i]);
          ctx.strokeStyle = `rgba(${p.color.join(",")},${p.life * .35})`;
          ctx.lineWidth = p.size * .65;
          ctx.stroke();
        }
        const flicker = p.glitter && Math.random() > .76 ? .25 : 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * Math.max(.25, p.life), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color.join(",")},${p.life * flicker})`;
        ctx.shadowColor = `rgb(${p.color.join(",")})`;
        ctx.shadowBlur = 9;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function frame(time) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(3, 1, 10, .16)";
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = "lighter";

        if (!reduced && time - lastLaunch > 420 + Math.random() * 550) {
          launch();
          if (Math.random() > .65) setTimeout(() => launch(), 120 + Math.random() * 180);
          lastLaunch = time;
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          const dx = r.tx - r.x, dy = r.ty - r.y;
          r.vx += dx * .0009;
          r.vy += dy * .0009;
          r.x += r.vx;
          r.y += r.vy;
          drawRocket(r);
          if (r.y <= r.ty || Math.hypot(dx, dy) < 22) {
            explode(r.x, r.y, r.color);
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.vx *= .988;
          p.vy = p.vy * .988 + .042;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          drawParticle(p);
          if (p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(frame);
      }

      addEventListener("resize", resize, { passive: true });
      addEventListener("pointerdown", event => {
        if (!reduced) {
          launch(event.clientX, Math.max(70, Math.min(event.clientY, height * .72)));
          setTimeout(() => launch(event.clientX + (Math.random() - .5) * 180, event.clientY), 110);
        }
      }, { passive: true });

      resize();
      if (reduced) {
        [[.2,.28],[.78,.24],[.5,.16]].forEach(([x,y], i) =>
          explode(width * x, height * y, colors[i])
        );
      } else {
        setTimeout(() => launch(width * .23, height * .3), 220);
        setTimeout(() => launch(width * .76, height * .24), 480);
        setTimeout(() => launch(width * .5, height * .15), 800);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
