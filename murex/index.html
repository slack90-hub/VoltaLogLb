<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="hero" aria-label="Celebration">
    <div class="number" aria-label="1727"><button class="digit" type="button" aria-label="Digit 1">1</button><button class="digit" type="button" aria-label="Digit 7">7</button><button class="digit" type="button" aria-label="Digit 2">2</button><button class="digit" type="button" aria-label="Digit 7">7</button></div>

      <div class="gallery-controls"><button class="gallery-button" id="previousPhoto" type="button" aria-label="Previous photo">&#8592;</button><span class="gallery-count" id="photoCount" aria-live="polite" aria-atomic="true"></span><button class="gallery-button" id="nextPhoto" type="button" aria-label="Next photo">&#8594;</button></div>

  <script src="tracking-config.js"></script>
  <script src="tracking.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById('fireworks'), ctx = canvas.getContext('2d');
      const digits = [...document.querySelectorAll('.digit')], egg = document.getElementById('egg'), veil = document.getElementById('veil');
      const photo = document.getElementById('memoryPhoto'), fallback = document.getElementById('photoFallback'), memory = egg.querySelector('.memory');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width, height, scale, particles = [], rockets = [], last = 0, nextAuto = 0, hidden = document.hidden, open = false, sequence = [], sequenceAt = 0, lastTap = 0, previousFocus;
      const colors = ['#ff536b', '#ff9c3e', '#ffe18a', '#85d9ff', '#b99cff', '#70f1c3', '#ff79c5'];
      const resize = () => { scale = Math.min(devicePixelRatio || 1, 1.8); width = innerWidth; height = innerHeight; canvas.width = Math.round(width * scale); canvas.height = Math.round(height * scale); ctx.setTransform(scale, 0, 0, scale, 0, 0); };
      addEventListener('resize', resize, { passive: true }); resize();
      const burst = (x, y, palette = colors, count = reduce ? 24 : 70, heart = false) => {
        for (let i = 0; i < count; i++) { let a, speed; if (heart) { const t = (i / count) * Math.PI * 2; const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); a = Math.atan2(hy, hx); speed = Math.hypot(hx, hy) * 5; } else { a = Math.random() * Math.PI * 2; speed = 1.4 + Math.random() * 5.7; } particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color:palette[i%palette.length],life:1,decay:.010+Math.random()*.014,size:1+Math.random()*2.1}); }
      };
      const launch = (x = width * (.15 + Math.random()*.7), y = height * (.13 + Math.random()*.38), palette) => rockets.push({x, y: height + 12, targetY:y, vx:(Math.random()-.5)*.8, vy:-((height-y)/38), palette: palette || colors, trail:[]});
      const special = () => { const palette = ['#ff496d','#e61f48','#ffd46e','#fff9e9']; const cx = width/2, cy = height*.42; [-.22,-.11,0,.11,.22].forEach((n,i) => setTimeout(() => { burst(cx+width*n, cy+Math.abs(n)*height*.25, palette, reduce?30:82, true); }, i*105)); };
      const animate = (now) => { requestAnimationFrame(animate); const dt = Math.min(32, now-last || 16) / 16; last=now; if (hidden) return; ctx.fillStyle = 'rgba(6,8,23,.19)'; ctx.fillRect(0,0,width,height);
        if (!open && !reduce && now > nextAuto) { launch(); nextAuto = now + 620 + Math.random()*940; }
        rockets = rockets.filter(r => { r.trail.push([r.x,r.y]); if (r.trail.length>9) r.trail.shift(); r.x+=r.vx*dt; r.y+=r.vy*dt; ctx.strokeStyle='#fff5d6'; ctx.globalAlpha=.8; ctx.beginPath(); r.trail.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.globalAlpha=1; if(r.y<=r.targetY) { burst(r.x,r.y,r.palette); return false; } return true; });
        particles = particles.filter(p => { p.px=p.x; p.py=p.y; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=.055*dt; p.vx*=.99; p.life-=p.decay*dt; if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.strokeStyle=p.color; ctx.lineWidth=p.size; ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke(); return true; }); ctx.globalAlpha=1;
      }; requestAnimationFrame(animate);
      canvas.addEventListener('pointerdown', e => { if (!open) launch(e.clientX, Math.max(60, e.clientY)); });
      document.addEventListener('visibilitychange', () => { hidden = document.hidden; if (!hidden) { last = performance.now(); nextAuto = last + 300; } });
      const reset = () => { sequence = []; sequenceAt = 0; };
      const activate = digit => { const now = performance.now(); if (open || now-lastTap < 230) return; lastTap = now; if (sequenceAt && now-sequenceAt > 5000) reset(); const expected = ['1','7','2','7']; if (digit === expected[sequence.length]) { sequence.push(digit); sequenceAt=now; if (sequence.length === expected.length) reveal(); } else { sequence = digit === expected[0] ? [digit] : []; sequenceAt = sequence.length ? now : 0; } };
      digits.forEach(button => button.addEventListener('click', e => { e.stopPropagation(); activate(button.textContent); }));
      const photos = ["photos/nad-maria.jpeg", "photos/20190706_104232.jpg", "photos/IMG-20190923-WA0065.jpg", "photos/IMG-20220528-WA0005.jpg", "photos/20220418_151605.jpg", "photos/IMG-20190426-WA0026.jpg", "photos/20240803_195525.jpg", "photos/20240614_211226.jpg", "photos/20240803_214137.jpg"];
      const counter = document.getElementById('photoCount');
      const previous = document.getElementById('previousPhoto'), next = document.getElementById('nextPhoto'), dismiss = document.getElementById('closeGallery');
      const frame = memory.querySelector('.frame');
      let photoIndex = 0, swipeStart = null, unlockId = null, openRecorded = false, revealReadyAt = 0;
      const recordVisibleOpen = () => {
        if (!open || openRecorded || !unlockId || document.hidden || !photo.complete || !photo.naturalWidth || photo.style.display === 'none') return;
        const delay = revealReadyAt - performance.now();
        if (delay > 0) { setTimeout(recordVisibleOpen, delay + 20); return; }
        const currentUnlock = unlockId;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (!open || openRecorded || currentUnlock !== unlockId || document.hidden || !photo.complete || !photo.naturalWidth || photo.style.display === 'none') return;
          openRecorded = true; window.murexTrack?.(unlockId, 'gallery_open');
        }));
      };
      document.addEventListener('visibilitychange', recordVisibleOpen);
      photo.onload = () => { photo.style.display = 'block'; fallback.style.display = 'none'; recordVisibleOpen(); };
      photo.onerror = () => { photo.style.display = 'none'; fallback.textContent = 'This photo could not be loaded. Try the next one.'; fallback.style.display = 'grid'; };
      const showPhoto = index => {
        photoIndex = (index + photos.length) % photos.length;
        photo.style.display = 'none'; fallback.style.display = 'grid'; fallback.textContent = 'Loading memory…';
        photo.alt = `A cherished memory, photo ${photoIndex + 1} of ${photos.length}`;
        counter.textContent = `${photoIndex + 1} / ${photos.length}`;
        photo.src = photos[photoIndex];
      };
      const reveal = () => {
        open = true; reset(); previousFocus = document.activeElement;
        unlockId = window.crypto?.randomUUID?.() || null;
        openRecorded = false; revealReadyAt = performance.now() + (reduce ? 120 : 750);
        window.murexTrack?.(unlockId, 'key_success');
        egg.setAttribute('aria-hidden', 'false'); veil.setAttribute('aria-hidden', 'false');
        document.querySelector('.hero').inert = true;
        showPhoto(0); veil.classList.add('open'); egg.classList.add('open'); dismiss.focus({preventScroll:true}); special();
      };
      const close = () => {
        if (!open) return;
        open = false; swipeStart = null; unlockId = null;
        document.querySelector('.hero').inert = false;
        previousFocus?.focus?.({preventScroll:true});
        egg.classList.remove('open'); veil.classList.remove('open');
        egg.setAttribute('aria-hidden', 'true'); veil.setAttribute('aria-hidden', 'true');
        photo.removeAttribute('src');
      };
      previous.addEventListener('click', () => showPhoto(photoIndex - 1));
      next.addEventListener('click', () => showPhoto(photoIndex + 1));
      dismiss.addEventListener('click', close);
      frame.addEventListener('pointerdown', e => { if (!e.isPrimary || e.button !== 0) return; swipeStart = {x:e.clientX, y:e.clientY}; frame.setPointerCapture(e.pointerId); });
      frame.addEventListener('pointerup', e => {
        if (!swipeStart) return;
        const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) showPhoto(photoIndex + (dx < 0 ? 1 : -1));
      });
      frame.addEventListener('pointercancel', () => { swipeStart = null; });
      egg.addEventListener('pointerdown', e => { if(e.target === egg) close(); });
      document.addEventListener('keydown', e => {
        if (!open) return;
        if (e.key === 'Escape') { e.preventDefault(); close(); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); showPhoto(photoIndex + (e.key === 'ArrowRight' ? 1 : -1)); }
        else if (e.key === 'Tab') {
          const controls = [dismiss, previous, next], current = controls.indexOf(document.activeElement);
          e.preventDefault(); controls[(current + (e.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
        }
      });
    })();
  </script>
