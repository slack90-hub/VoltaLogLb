<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#060817">
  <title>27 jul @ 0:00</title>
  <style>
    :root { color-scheme: dark; --warm: #fff4df; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #060817; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sky, canvas, .veil, .egg { position: fixed; inset: 0; }
    .sky { z-index: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 115%, #1c2045 0%, #0b1027 35%, #060817 73%); }
    .sky::before, .sky::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
    .sky::before { opacity: .75; background-image: radial-gradient(circle at 11% 17%, #fff 0 1px, transparent 1.5px), radial-gradient(circle at 72% 24%, #cbd7ff 0 1px, transparent 1.5px), radial-gradient(circle at 87% 68%, #fff 0 1px, transparent 1.5px), radial-gradient(circle at 31% 74%, #fff 0 1px, transparent 1.5px); background-size: 240px 190px, 310px 270px, 280px 235px, 365px 310px; }
    .sky::after { background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,.35) 100%); }
    #fireworks { z-index: 1; width: 100%; height: 100%; touch-action: manipulation; }
    .hero { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; pointer-events: none; padding: max(22px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left)); }
    .number { display: flex; align-items: baseline; color: #fffaf0; font-size: clamp(7rem, 26vw, 25rem); font-weight: 800; line-height: .8; letter-spacing: -.095em; filter: drop-shadow(0 0 8px rgba(255,242,205,.9)) drop-shadow(0 0 30px rgba(255,153,96,.42)) drop-shadow(0 0 75px rgba(130,119,255,.24)); user-select: none; pointer-events: auto; }
    .digit { appearance: none; display: block; margin: 0; padding: 0; border: 0; color: inherit; background: transparent; font: inherit; letter-spacing: inherit; line-height: inherit; cursor: default; text-shadow: 0 0 1px #fff; -webkit-tap-highlight-color: transparent; }
    .digit:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: .08em; border-radius: .08em; }
    .date { position: fixed; z-index: 3; right: max(22px, calc(env(safe-area-inset-right) + 16px)); bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px)); color: rgba(255,250,240,.76); font-size: clamp(.7rem, 2.4vw, .88rem); font-weight: 600; letter-spacing: .16em; text-transform: lowercase; text-shadow: 0 1px 12px #000; }
    .veil { z-index: 4; opacity: 0; background: rgba(4,5,16,.58); backdrop-filter: blur(0); pointer-events: none; transition: opacity .7s ease, backdrop-filter .7s ease; }
    .egg { z-index: 5; display: grid; place-items: center; padding: max(26px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
    .egg.open, .veil.open { opacity: 1; }
    .veil.open { backdrop-filter: blur(10px); }
    .egg.open { pointer-events: auto; }
    .memory { position: relative; width: min(82vw, 390px); margin: 0; transform: translateY(16px) scale(.94); opacity: 0; transition: transform .75s cubic-bezier(.16,1,.3,1), opacity .55s ease; text-align: center; }
    .egg.open .memory { transform: translateY(0) scale(1); opacity: 1; }
    .memory::before { content: ""; position: absolute; z-index: -1; inset: -26px; background: radial-gradient(circle, rgba(255,151,154,.36), transparent 64%); filter: blur(12px); }
    .frame { position: relative; overflow: hidden; aspect-ratio: 3 / 4; border: 1px solid rgba(255,236,200,.72); border-radius: 5px; padding: 9px; background: linear-gradient(135deg, #f8d99a, #fff7e9 42%, #b78350); box-shadow: 0 24px 75px rgba(0,0,0,.62), 0 0 34px rgba(255,170,146,.42); }
    .frame img { display: block; width: 100%; height: 100%; border-radius: 2px; object-fit: cover; background: #291d28; }
    .fallback { display: none; height: 100%; place-items: center; border-radius: 2px; background: radial-gradient(circle at 50% 32%, #75455b, #221724 70%); color: rgba(255,242,220,.82); font: italic 1.1rem Georgia, serif; }
    .message { margin: 21px 0 0; color: var(--warm); font: 400 clamp(1rem, 4vw, 1.2rem)/1.35 Georgia, "Times New Roman", serif; letter-spacing: .01em; text-shadow: 0 2px 14px #000; }
    .float { position: absolute; color: #ffd8dc; opacity: 0; font-size: 1rem; animation: float 4s ease-in-out infinite; }
    .float:nth-of-type(2) { top: 11%; left: -15%; animation-delay: -1.2s; color: #ffe29b; }
    .float:nth-of-type(3) { top: 51%; right: -16%; animation-delay: -2.5s; color: #fff; }
    @keyframes float { 0%,100% { transform: translateY(5px) scale(.75); opacity: .15; } 50% { transform: translateY(-16px) scale(1.1); opacity: .88; } }
    @media (max-width: 480px) { .number { font-size: clamp(6.4rem, 31vw, 11rem); } .frame { padding: 7px; } .memory { width: min(78vw, 340px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } .veil, .egg, .memory { transition-duration: .12s; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="hero" aria-label="Celebration">
    <div class="number" aria-label="2717"><button class="digit" type="button" aria-label="Digit 2">2</button><button class="digit" type="button" aria-label="Digit 7">7</button><button class="digit" type="button" aria-label="Digit 1">1</button><button class="digit" type="button" aria-label="Digit 7">7</button></div>
  </main>
  <time class="date">27 jul @ 0:00</time>
  <div class="veil" id="veil" aria-hidden="true"></div>
  <section class="egg" id="egg" role="dialog" aria-modal="true" aria-label="A special memory" aria-hidden="true">
    <figure class="memory" tabindex="-1">
      <span class="float" aria-hidden="true">♥</span><span class="float" aria-hidden="true">✦</span><span class="float" aria-hidden="true">♥</span>
      <div class="frame"><img id="memoryPhoto" alt="A cherished memory" decoding="async"><div class="fallback" id="photoFallback">A cherished memory</div></div>
      <figcaption class="message">Some dates are more than numbers ❤️</figcaption>
    </figure>
  </section>
  <script>
    (() => {
      const canvas = document.getElementById('fireworks'), ctx = canvas.getContext('2d');
      const digits = [...document.querySelectorAll('.digit')], egg = document.getElementById('egg'), veil = document.getElementById('veil');
      const photo = document.getElementById('memoryPhoto'), fallback = document.getElementById('photoFallback'), memory = egg.querySelector('.memory');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width, height, scale, particles = [], rockets = [], last = 0, nextAuto = 0, hidden = document.hidden, open = false, sequence = [], sequenceAt = 0, lastTap = 0, closeTimer, previousFocus;
      const colors = ['#ff536b', '#ff9c3e', '#ffe18a', '#85d9ff', '#b99cff', '#70f1c3', '#ff79c5'];
      const resize = () => { scale = Math.min(devicePixelRatio || 1, 1.8); width = innerWidth; height = innerHeight; canvas.width = Math.round(width * scale); canvas.height = Math.round(height * scale); ctx.setTransform(scale, 0, 0, scale, 0, 0); };
      addEventListener('resize', resize, { passive: true }); resize();
      const burst = (x, y, palette = colors, count = reduce ? 24 : 70, heart = false) => {
        for (let i = 0; i < count; i++) { let a, speed; if (heart) { const t = (i / count) * Math.PI * 2; const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); a = Math.atan2(hy, hx); speed = Math.hypot(hx, hy) * 5; } else { a = Math.random() * Math.PI * 2; speed = 1.4 + Math.random() * 5.7; } particles.push({x,y,px:x,py:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color:palette[i%palette.length],life:1,decay:.010+Math.random()*.014,size:1+Math.random()*2.1}); }
      };
      const launch = (x = width * (.15 + Math.random()*.7), y = height * (.13 + Math.random()*.38), palette) => rockets.push({x, y: height + 12, targetY:y, vx:(Math.random()-.5)*.8, vy:-((height-y)/38), palette: palette || colors, trail:[]});
      const special = () => { const palette = ['#ff496d','#e61f48','#ffd46e','#fff9e9']; const cx = width/2, cy = height*.42; [-.22,-.11,0,.11,.22].forEach((n,i) => setTimeout(() => { burst(cx+width*n, cy+Math.abs(n)*height*.25, palette, reduce?30:82, true); }, i*105)); };
      const animate = (now) => { requestAnimationFrame(animate); const dt = Math.min(32, now-last || 16) / 16; last=now; if (hidden) return; ctx.fillStyle = 'rgba(6,8,23,.19)'; ctx.fillRect(0,0,width,height);
        if (!open && !reduce && now > nextAuto) { launch(); nextAuto = now + 620 + Math.random()*940; }
        rockets = rockets.filter(r => { r.trail.push([r.x,r.y]); if (r.trail.length>9) r.trail.shift(); r.x+=r.vx*dt; r.y+=r.vy*dt; ctx.strokeStyle='#fff5d6'; ctx.globalAlpha=.8; ctx.beginPath(); r.trail.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.globalAlpha=1; if(r.y<=r.targetY) { burst(r.x,r.y,r.palette); return false; } return true; });
        particles = particles.filter(p => { p.px=p.x; p.py=p.y; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=.055*dt; p.vx*=.99; p.life-=p.decay*dt; if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.strokeStyle=p.color; ctx.lineWidth=p.size; ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke(); return true; }); ctx.globalAlpha=1;
      }; requestAnimationFrame(animate);
      canvas.addEventListener('pointerdown', e => { if (!open) launch(e.clientX, Math.max(60, e.clientY)); });
      document.addEventListener('visibilitychange', () => { hidden = document.hidden; if (!hidden) { last = performance.now(); nextAuto = last + 300; } });
      const reset = () => { sequence = []; sequenceAt = 0; };
      const activate = digit => { const now = performance.now(); if (open || now-lastTap < 230) return; lastTap = now; if (sequenceAt && now-sequenceAt > 5000) reset(); const expected = ['2','7','1','7']; if (digit === expected[sequence.length]) { sequence.push(digit); sequenceAt=now; if (sequence.length === expected.length) reveal(); } else { sequence = digit === expected[0] ? [digit] : []; sequenceAt = sequence.length ? now : 0; } };
      digits.forEach(button => button.addEventListener('click', e => { e.stopPropagation(); activate(button.textContent); }));
      const reveal = () => { open=true; reset(); previousFocus=document.activeElement; egg.setAttribute('aria-hidden','false'); veil.setAttribute('aria-hidden','false'); photo.src='../assets/nad-maria.jpeg'; photo.onload=()=>{ photo.style.display='block'; fallback.style.display='none'; }; photo.onerror=()=>{ photo.removeAttribute('src'); photo.style.display='none'; fallback.style.display='grid'; }; veil.classList.add('open'); egg.classList.add('open'); memory.focus({preventScroll:true}); special(); closeTimer=setTimeout(close,10000); };
      const close = () => { if(!open) return; open=false; clearTimeout(closeTimer); egg.classList.remove('open'); veil.classList.remove('open'); egg.setAttribute('aria-hidden','true'); veil.setAttribute('aria-hidden','true'); setTimeout(()=>photo.removeAttribute('src'),500); previousFocus?.focus?.({preventScroll:true}); };
      egg.addEventListener('pointerdown', e => { if(e.target === egg) close(); });
      document.addEventListener('keydown', e => { if (!open) return; if (e.key === 'Escape') { e.preventDefault(); close(); } else if (e.key === 'Tab') { e.preventDefault(); memory.focus({preventScroll:true}); } });
    })();
  </script>
</body>
</html>
