<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#132526">
  <title>Note Sent</title>
  <style>
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 18% 12%,rgba(215,168,74,.2),transparent 34%),linear-gradient(145deg,#102122,#1d3c3d 52%,#102122);color:#152829;font-family:"Segoe UI",system-ui,sans-serif}.card{width:min(100%,520px);padding:clamp(32px,8vw,56px);border:1px solid rgba(255,255,255,.55);border-radius:28px;background:rgba(255,253,248,.95);box-shadow:0 26px 80px rgba(14,34,35,.22);text-align:center}.mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 20px;border-radius:50%;background:#315f5c;color:#fff;font-size:28px}h1{margin:0;font:500 clamp(34px,9vw,50px)/1.05 Georgia,serif;letter-spacing:-.04em}p{margin:17px auto 28px;color:#667675;line-height:1.65}.close{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 24px;border-radius:13px;background:#132526;color:#fff;text-decoration:none;font-weight:800}.close:hover{background:#315f5c}.close:focus-visible{outline:3px solid rgba(215,168,74,.6);outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Your note was sent.</h1>
    <p>You can leave this page now. Thank you for trusting this space.</p>
    <a class="close" href="https://mdslb.com/" rel="noreferrer">Close this page</a>
  </main>
</body>
</html>
