<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#0d2b30">
  <title>Under Construction | MDS</title>
  <style>
    :root {
      color-scheme: dark;
      --deep: #081f23;
      --teal: #0f5b5c;
      --gold: #e2aa2f;
      --cream: #faf7ef;
      --muted: rgba(255,255,255,.68);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 18% 18%, rgba(226,170,47,.18), transparent 30%),
        radial-gradient(circle at 84% 78%, rgba(28,126,124,.26), transparent 36%),
        linear-gradient(145deg, var(--deep), #123f43);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    main {
      position: relative;
      width: min(720px, 100%);
      padding: clamp(38px, 8vw, 76px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(7,29,32,.66);
      box-shadow: 0 30px 90px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
    }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 28px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font: 800 25px/1 Georgia, serif;
      letter-spacing: -.08em;
      box-shadow: 0 0 0 9px rgba(226,170,47,.08);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #f3cf72;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(43px, 9vw, 78px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    p {
      max-width: 520px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.65;
    }
    .line {
      width: 76px;
      height: 3px;
      margin: 32px auto 0;
      border-radius: 999px;
      background: var(--gold);
    }
    small {
      display: block;
      margin-top: 22px;
      color: rgba(255,255,255,.46);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      main { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">MDS</div>
    <div class="eyebrow">Murex Digital Solutions</div>
    <h1>Under Construction</h1>
    <p>Our website is temporarily unavailable while we work on something better. Please check back soon.</p>
    <div class="line" aria-hidden="true"></div>
    <small>We’ll be back shortly</small>
  </main>
</body>
</html>
